[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaso-openai-proxy"
version = "0.1.0"
description = "OpenAI-compatible + native proxy for Metaso (metaso.cn) web login session."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "playwright==1.60.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = [
    "app",
    "console_ingest",
    "logging_setup",
    "main",
    "models_map",
    "save_storage_state",
    "storage_state",
    "verify_storage_state",
    "web_client",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["profile*", "secrets*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
