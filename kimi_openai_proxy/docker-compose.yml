services:
  kimi-openai-proxy:
    build:
      context: .
      args:
        # 国内加速：基础镜像走 mcr.azure.cn，pip/apt 走国内源
        # 海外环境可设 USE_CN_MIRROR=0 并改用 mcr.microsoft.com/playwright/python:v1.60.0-noble
        USE_CN_MIRROR: "1"
        BASE_IMAGE: mcr.azure.cn/playwright/python:v1.60.0-noble
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        APT_MIRROR: mirrors.aliyun.com
    container_name: kimi-openai-proxy
    ports:
      - "18003:8000"
    environment:
      KIMI_BACKEND: browser
      KIMI_PROXY_API_KEY: local-secret
      KIMI_BROWSER_PROFILE: /data/profile
      KIMI_BROWSER_HEADLESS: "1"
      # curl cookie 单独使用可能仍会跳转登录页，推荐 storage state（见 README）
      KIMI_STORAGE_STATE_FILE: /run/secrets/kimi_storage.json
      KIMI_BROWSER_TIMEOUT: "600"
      KIMI_BROWSER_START_TIMEOUT: "600"
      KIMI_BUSY_MAX_ATTEMPTS: "5"
      KIMI_BUSY_RETRY_WAIT_SECONDS: "60"
      KIMI_BUSY_RETRY_BACKOFF: "1.5"
      KIMI_BUSY_RETRY_WAIT_MAX_SECONDS: "180"
      KIMI_NEW_CHAT_PER_REQUEST: "1"
      KIMI_LOG_LEVEL: INFO
      KIMI_LOG_MAX_CHARS: "400"
    volumes:
      - ./secrets:/run/secrets:ro

volumes:
  kimi-browser-profile:
