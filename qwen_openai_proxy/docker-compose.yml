services:
  qwen-openai-proxy:
    build:
      context: .
      args:
        USE_CN_MIRROR: "1"
        BASE_IMAGE: mcr.azure.cn/playwright/python:v1.60.0-noble
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        APT_MIRROR: mirrors.aliyun.com
    container_name: qwen-openai-proxy
    ports:
      - "18005:8000"
    environment:
      QWEN_BACKEND: browser
      QWEN_PROXY_API_KEY: local-secret
      QWEN_BROWSER_PROFILE: /data/profile
      QWEN_BROWSER_HEADLESS: "1"
      QWEN_STORAGE_STATE_FILE: /run/secrets/qwen_storage.json
      QWEN_BROWSER_TIMEOUT: "600"
      QWEN_BROWSER_START_TIMEOUT: "600"
      QWEN_IMAGE_TIMEOUT: "900"
      QWEN_VIDEO_TIMEOUT: "1800"
      QWEN_NEW_CHAT_PER_REQUEST: "1"
      QWEN_LOG_LEVEL: INFO
      QWEN_LOG_MAX_CHARS: "400"
    volumes:
      - ./secrets:/run/secrets:ro

volumes:
  qwen-browser-profile:
